name: Deploy Tutorial Site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify notebooks directory
        run: |
          echo "=== Part 1 (Image Processing) ==="
          find ../notebooks/part1-image-processing/ -name "*.ipynb" || echo "no notebooks"
          echo "=== Part 2 (Optimization & 3D) ==="
          find ../notebooks/part2-optimization-3d/ -name "*.ipynb" || echo "no notebooks"
          echo "=== Appendix ==="
          find ../notebooks/appendix/ -name "*.ipynb" || echo "no notebooks"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Copy notebook assets to docs
        run: |
          mkdir -p ../docs/notebooks
          # 只复制网站需要展示的资产：排除体积巨大的数据集文件
          # （semper 的 .ppm / .3Dpoints / .camera，Notebook 已把结果内嵌为 base64）
          rsync -a \
            --exclude='*.ppm' \
            --exclude='*.3Dpoints' \
            --exclude='*.camera' \
            --exclude='.ipynb_checkpoints/' \
            --exclude='Hands-on-CV/' \
            ../notebooks/ ../docs/notebooks/
          du -sh ../docs/notebooks

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          force_orphan: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
